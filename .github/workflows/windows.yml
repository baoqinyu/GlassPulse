name: Windows build and release
on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public content
        shell: pwsh
        run: ./scripts/check-public-content.ps1
      - name: Build and run accounting scenarios
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Render UI with synthetic data and check interactions
        shell: pwsh
        run: |
          $exe = (Resolve-Path ./dist/GlassPulse.exe).Path
          $previewArgs = '--preview build\preview --data-dir build\preview-data'
          $preview = Start-Process $exe -ArgumentList $previewArgs -WindowStyle Hidden -PassThru -Wait
          if ($preview.ExitCode -ne 0) { throw 'UI preview failed' }
          $result = Get-Content ./build/preview-data/preview-result.json -Raw | ConvertFrom-Json
          if (-not $result.Passed) { throw 'UI preview did not pass' }
          $smoke = Start-Process $exe -ArgumentList '--smoke --data-dir build\smoke-data' -WindowStyle Hidden -PassThru -Wait
          if ($smoke.ExitCode -ne 0) { throw 'Native UI smoke failed' }
          $result = Get-Content ./build/smoke-data/ui-smoke.json -Raw | ConvertFrom-Json
          if (-not $result.Passed) { throw 'Native UI smoke did not pass' }
      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { ([version](Get-Item ./dist/GlassPulse.exe).VersionInfo.ProductVersion).ToString(3) }
          ./package.ps1 -SkipBuild -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: GlassPulse-Windows
          path: |
            dist/GlassPulse.exe
            dist/GlassPulse-*-windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: GlassPulse-UI-previews
          path: build/preview/*.png
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name GlassPulse-Windows --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
          $assets = @(Get-ChildItem ./release-assets -File | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "GlassPulse $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
